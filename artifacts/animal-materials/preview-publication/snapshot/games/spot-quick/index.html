<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spot Quick</title>
    <meta name="description" content="Mobile-first HTML5 Canvas arcade game featuring procedural vector silhouettes and real-time optical aperture de-blurring." />
    <meta property="og:title" content="Spot Quick" />
    <meta property="og:description" content="Mobile-first HTML5 Canvas arcade game featuring procedural vector silhouettes and real-time optical aperture de-blurring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="../../assets/unified-title-menu.css" />
    <script src="../../shared/toenow-levels.js"></script>
    <script src="../../shared/toenow-security.js"></script>
    <script src="../../shared/toenow-platform.js"></script>
    <script src="../../shared/toenow-analytics.js"></script>
    <script src="../../shared/toenow-materials.js"></script>
    <script src="../../shared/toenow-materials-ui.js"></script>
    <script src="../../shared/toenow-sdk.js"></script>
    <script src="../../shared/toenow-i18n-core.js"></script>
    <script src="../../shared/toenow-i18n-games-a.js"></script>
    <script src="../../shared/toenow-i18n-games-b.js"></script>
    <script src="../../shared/toenow-i18n-animals.js"></script>
<script src="../../shared/toenow-i18n.js"></script>
    <link rel="stylesheet" href="../../assets/toenow-tutorials.css">
    <script src="../../shared/toenow-tutorial-config.js"></script>
    <script src="../../shared/toenow-tutorials.js"></script>
<script src="../../shared/toenow-animals.js"></script>
    <script src="../../shared/toenow-screen-config.js"></script>
    <script src="../../shared/toenow-screens.js"></script>
    <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../assets/toenow-animals.css">
<link rel="stylesheet" href="../../assets/toenow-game-hud.css">
</head>
  <body>
    <div class="app-wrapper" id="appWrapper">
      <!-- Top Piped Status Display -->
      <header class="hud-header" id="hudHeader"><div class="island-live-hud" data-metrics="3"><div class="island-hud-metric"><span class="island-hud-label">TIME</span><span id="live-time" class="island-hud-value">60.0s</span></div><div class="island-hud-metric"><span class="island-hud-label">SCORE</span><strong class="hud-score-val island-hud-value" id="hudScoreText">0</strong></div><div class="island-hud-metric"><span class="island-hud-label">COMBO</span><span id="live-combo" class="island-hud-value">0x</span></div><div class="island-hud-controls"><button id="btnAudioHud" type="button" class="toenow-icon-control" aria-label="Toggle Audio" title="Toggle Audio" aria-pressed="true" data-muted="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use class="control-sound-on" href="../../assets/toenow-control-icons.svg#sound-on"/><use class="control-sound-off" href="../../assets/toenow-control-icons.svg#sound-off"/></svg></button><button id="btnPauseHud" type="button" class="toenow-icon-control" aria-label="Pause Game (P)" title="Pause Game (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="../../assets/toenow-control-icons.svg#pause"/></svg></button><button id="btnRestartHud" type="button" class="toenow-icon-control" aria-label="Restart Run" title="Restart Run"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="../../assets/toenow-control-icons.svg#restart"/></svg></button></div></div><div class="island-hud-legacy" aria-hidden="true">
        <div class="hud-piped-bar" id="hudPipedText">
          WAVE 1 | CLARITY: 0% | STREAK: 0 | TIME: 60.0s
        </div>
        <div class="hud-sub-bar">
          <span>SCORE: </span>
          <span>TIER: <strong class="hud-cat-val" id="hudCatText">L1 NOVICE</strong></span>
          <span class="hud-tier-val" id="hudTierText">+100 PTS · +2.0s</span>
          <div class="hud-controls">



          </div>
        </div>
      </div></header>

      <!-- Main Canvas & Synchronized Hit Layer -->
      <main class="canvas-stage" id="canvasStage">
        <canvas id="gameCanvas" aria-label="Spot Quick Viewport"></canvas>
        <div class="candidate-dom-layer" id="candidateDomLayer">
          <button type="button" class="candidate-hit-btn" id="candBtn0" data-index="0" aria-label="Option 1"></button>
          <button type="button" class="candidate-hit-btn" id="candBtn1" data-index="1" aria-label="Option 2"></button>
          <button type="button" class="candidate-hit-btn" id="candBtn2" data-index="2" aria-label="Option 3"></button>
          <button type="button" class="candidate-hit-btn" id="candBtn3" data-index="3" aria-label="Option 4"></button>
        </div>

        <!-- Briefing Modal -->
        <div class="modal-backdrop unified-title-screen" id="briefingModal" role="dialog" aria-modal="true" aria-labelledby="briefingTitle" data-toenow-screen="title"></div>

        <!-- Pause Modal (Anti-cheat blackout) -->
        <div class="modal-backdrop unified-pause-screen hidden" id="pauseModal" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
          <div class="unified-pause-card">
            <div class="unified-pause-kicker">ANALYSIS SUSPENDED</div>
            <h2 class="unified-pause-title" id="pauseTitle">PAUSED</h2>
            <p class="unified-pause-notice">Specimen and candidate silhouettes hidden while paused.</p>

            <div class="unified-pause-stats-grid">
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">SCORE</span>
                <span id="pauseScoreVal" class="unified-pause-stat-val">0</span>
              </div>
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">WAVE</span>
                <span id="pauseWaveVal" class="unified-pause-stat-val">1</span>
              </div>
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">TIME</span>
                <span id="pauseTimeVal" class="unified-pause-stat-val">60.0s</span>
              </div>
            </div>

            <div class="unified-pause-btn-row">
              <button id="btnResumeFocus" type="button" class="unified-pause-resume-btn">RESUME</button>
              <button id="btnRestartFocus" type="button" class="unified-pause-action-btn">RESTART</button>
              <button id="btnTitleFocus" type="button" class="unified-pause-action-btn">TITLE</button>
            </div>
          </div>
        </div>

        <!-- Game Over Modal -->
        <div class="modal-backdrop unified-gameover-screen hidden" id="gameOverModal" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle" data-toenow-screen="gameover"></div>
      </main>
    </div>


    <script src="./shapes.js"></script>
    <script src="./rules.js"></script>
    <script src="./audio.js"></script>
    <script src="./renderer.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
