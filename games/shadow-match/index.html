<script src="../../shared/toenow-i18n.js"></script>

  <link rel="stylesheet" href="../../assets/toenow-animals.css">
<link rel="stylesheet" href="../../assets/toenow-game-hud.css">
</head>
  <body data-state="title">
    <main id="viewport-shell">
      <div id="arcade-frame">
        <!-- Main High-DPI Canvas for Optical Chamber + Unified Shadow Occlusion + Dock Schematics -->
        <canvas id="game-canvas" data-testid="eclipse-canvas"></canvas>

        <!-- ZONE 1: Top 15% Telemetry HUD Band -->
        <section id="hud-zone" aria-label="Optical Telemetry HUD"><div class="island-live-hud" data-metrics="3"><div class="island-hud-metric"><span class="island-hud-label">TIME</span><span id="hud-timer" aria-live="off" class="island-hud-value">60.0s</span></div><div class="island-hud-metric"><span class="island-hud-label">SCORE</span><span id="hud-score" class="hud-hero-num island-hud-value">000000</span></div><div class="island-hud-metric"><span class="island-hud-label">COMBO</span><span id="hud-combo" class="combo-readout island-hud-value">1x</span></div><div class="island-hud-controls"><button
                  type="button"
                  id="btn-mute"
                  class="icon-btn"
                  tabindex="-1"
                  aria-label="Toggle Audio Mute (M)"
                  title="Mute / Unmute [M]"
                >
                  <svg id="icon-sound-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                  </svg>
                  <svg id="icon-sound-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                  </svg>
                </button><button
                  type="button"
                  id="btn-pause"
                  class="icon-btn"
                  tabindex="-1"
                  aria-label="Pause Game (P)"
                  title="Pause [P]"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                  </svg>
                </button><button
                  type="button"
                  id="btn-restart-quick"
                  class="icon-btn"
                  tabindex="-1"
                  aria-label="Restart Run (R)"
                  title="Restart [R]"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                  </svg>
                </button></div></div><div class="island-hud-legacy" aria-hidden="true">
          <div class="hud-top-row">
            <div class="hud-cluster-left">
              <div class="hud-metric-block">
                <span class="hud-kicker">SCORE</span>

              </div>
              <div class="hud-metric-block">
                <span class="hud-kicker">COMBO</span>

              </div>
            </div>

            <div class="hud-cluster-center">

              <div class="timer-bar-track">
                <div id="hud-timer-bar"></div>
              </div>
            </div>

            <div class="hud-cluster-right">
              <div class="hud-right-metrics">
                <div class="hud-metric-block">
                  <span class="hud-kicker">LEVEL</span>
                  <span id="hud-level" class="hud-hero-num">1</span>
                </div>
                <div class="hud-metric-block">
                  <span class="hud-kicker">WAVE</span>
                  <span id="hud-wave" class="hud-hero-num">1</span>
                </div>
              </div>

              <div class="hud-utility-btns">



              </div>
            </div>
          </div>

          <div id="hud-banner-wrap" class="hud-sub-banner">
            <span id="hud-status-text">TRACKING SILHOUETTES</span>
            <span id="hud-feedback-tag">PAR 5.0s</span>
          </div>
        </div></section>

        <!-- ZONE 2: Middle 42% Optical Projection Chamber -->
        <section id="chamber-zone" aria-label="Optical Backlight Projection Chamber"></section>

        <!-- ZONE 3: Bottom 43% Composite Schematic Selection Dock -->
        <section id="dock-zone" aria-label="Candidate Schematic Selection Dock">
          <div class="dock-header-line">
            <span id="dock-instruction">SELECT MATCHING COMPOSITE SCHEMATIC</span>
            <span id="dock-target-count">2 TARGETS</span>
          </div>
          <div id="dock-grid" class="grid-2x2" role="group" aria-label="Candidate Schematics"></div>
        </section>

        <!-- OVERLAY 1: Concise Title / Boot Overlay -->
        <section id="title-overlay" class="overlay-screen unified-title-screen" aria-label="Shadow Match Title" data-toenow-screen="title"></section>

        <!-- OVERLAY 2: Pause Modal -->
        <section id="pause-overlay" class="overlay-screen unified-pause-screen hidden" aria-label="Optics Paused">
          <div class="unified-pause-card">
            <div class="unified-pause-kicker">ANALYSIS SUSPENDED</div>
            <h2 class="unified-pause-title">PAUSED</h2>
            <p class="unified-pause-notice">Chamber silhouettes hidden while paused.</p>

            <div class="unified-pause-stats-grid">
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">SCORE</span>
                <span id="pause-stat-score" class="unified-pause-stat-val">0</span>
              </div>
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">WAVE</span>
                <span id="pause-stat-wave" class="unified-pause-stat-val">1</span>
              </div>
              <div class="unified-pause-stat-box">
                <span class="unified-pause-stat-label">TIME</span>
                <span id="pause-stat-time" class="unified-pause-stat-val">60.0s</span>
              </div>
            </div>

            <div class="unified-pause-btn-row">
              <button type="button" id="btn-resume" class="unified-pause-resume-btn">
                RESUME
              </button>
              <button type="button" id="btn-pause-restart" class="unified-pause-action-btn">
                RESTART
              </button>
              <button type="button" id="btn-pause-title" class="unified-pause-action-btn">
                TITLE
              </button>
            </div>
          </div>
        </section>

        <!-- Shared game over layout -->
        <section id="gameover-overlay" class="overlay-screen unified-gameover-screen hidden" role="dialog" aria-modal="true" aria-labelledby="gameover-title" data-toenow-screen="gameover"></section>
      </div>
    </main>


    <script src="./audio.js"></script>
    <script src="./shapes.js"></script>
    <script src="./rules.js"></script>
    <script src="./renderer.js"></script>
    <script src="./main.js?v=five-success-20261027-1"></script>
  </body>
</html>
