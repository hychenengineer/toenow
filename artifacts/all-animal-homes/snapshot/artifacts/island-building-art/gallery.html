<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索島建築圖鑑</title><style>body{margin:0;padding:28px;background:#e9e5db;color:#303d38;font:15px/1.5 system-ui,sans-serif}h1{margin:0 0 8px}p{margin:0 0 25px;color:#59665f}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}figure{margin:0;background:#f7f4eb;border-radius:14px;overflow:hidden}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#e9e8e1 0 25%,#f4f1e9 0 50%) 0/20px 20px}figcaption{padding:9px 12px;font-size:12px}a{color:#38655a}.gallery section{grid-column:1/-1;font-weight:700;font-size:19px;margin-top:8px}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><h1>探索島｜建築成長圖鑑</h1><p>同一地點，五個成長階段。透明原圖與細節可點開查看。</p><div class="gallery"></div><script>
const names={observatory:'星象觀測站',lighthouse:'記憶燈塔',station:'救援港灣',music:'音石庭園',workshop:'圖紋工坊',garden:'加總溫室',arch:'回聲庭院',lookout:'森林瞭望臺',temple:'剪影遺跡',orbit:'軌道觀景臺'};
const onlyLevel=Number(new URLSearchParams(location.search).get('level'));
document.querySelector('.gallery').innerHTML=Object.entries(names).map(([kind,name])=>(onlyLevel?'':'<section>'+name+'</section>')+(onlyLevel?[onlyLevel]:[1,2,3,4,5]).map(level=>'<figure><a href="../../assets/island-buildings/sources/'+kind+'-level'+level+'.png" target="_blank"><img src="../../assets/island-buildings/sources/'+kind+'-level'+level+'.png" alt="'+name+' Level '+level+'"></a><figcaption>'+name+' · LEVEL '+level+'</figcaption></figure>').join('')).join('');
</script></body></html>
