    <div id="lesson-shade" hidden aria-hidden="true"></div>

      <section class="battlefield" aria-label="Battlefield">
        <div class="field-legend"><span class="ally" id="ally-label"></span><span id="phase-label" role="status"></span><span class="enemy" id="enemy-label"></span></div>

        <div class="field-bottom"><span id="tile-help"></span><span id="reward-preview"></span></div>
      </section>

    </div>
    <div class="field-turn-controls"><button id="restart" type="button" class="text-button"></button><span id="remaining-orders" role="status" aria-live="polite"></span><button id="end-turn" type="button"></button></div>

    <section class="journal"><span class="panel-label" id="journal-label"></span><div id="journal" role="log" aria-live="polite"></div></section>
